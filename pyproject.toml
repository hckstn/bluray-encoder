[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bluray_encoder"
version = "0.1.0"
description = "Automated Blu-ray encoding workflow using MakeMKV, FFmpeg and TMDb."
authors = [
    {name = "M H"}
]
requires-python = ">=3.12"

dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.5",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = [
    "."
]
